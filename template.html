<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOL 2026 Snippets</title>
<style>
:root{--bg:#f7f8fa;--panel:#fff;--text:#1b1f27;--muted:#657084;--border:#dde1e8;--accent:#2563eb;--accent-text:#fff;--code-bg:#0f172a;--code-text:#e2e8f0;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--panel:#151b23;--text:#e6e9ef;--muted:#8b95a7;--border:#2a3340;--accent:#4f8cff;--accent-text:#fff;--code-bg:#0a0e14;--code-text:#dbe3ef}}
:root[data-theme="dark"]{--bg:#0d1117;--panel:#151b23;--text:#e6e9ef;--muted:#8b95a7;--border:#2a3340;--accent:#4f8cff;--accent-text:#fff;--code-bg:#0a0e14;--code-text:#dbe3ef}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;margin-right:auto}
header h1 small{font-weight:400;color:var(--muted);margin-left:8px}
input[type=search]{padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;min-width:200px}
button,.btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button.done{background:var(--ok);border-color:var(--ok);color:#fff}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;max-width:1200px;margin:0 auto;padding:20px 16px 60px}
nav{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;font-size:14px}
nav h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 4px}
nav h2:first-child{margin-top:0}
nav a{display:block;padding:3px 8px;border-radius:5px;color:var(--text);text-decoration:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
nav a:hover,nav a.active{background:var(--panel);color:var(--accent)}
section.group>h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px}
section.group:first-child>h2{margin-top:0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.card-head{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-head h3{margin:0 auto 0 0;font:600 14px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.card-head .meta{color:var(--muted);font-size:12px}
pre{margin:0;padding:14px;background:var(--code-bg);color:var(--code-text);overflow:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;tab-size:4}
.hidden{display:none}
.empty{color:var(--muted);padding:20px 0}
mark{background:#fde047;color:#000;border-radius:2px}
@media (max-width:760px){.layout{grid-template-columns:1fr}nav{display:none}input[type=search]{min-width:0;flex:1 1 100%}}
pre code.hljs{padding:0;background:transparent}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
<header>
  <h1>HOL 2026 Snippets <small id="count"></small></h1>
  <input type="search" id="q" placeholder="Filter by filename or content…" aria-label="Filter snippets">
  <button id="theme" aria-label="Toggle theme">Theme</button>
</header>
<div class="layout">
  <nav id="nav" aria-label="Snippets"></nav>
  <main id="main"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const DATA=/*DATA*/[];
const $=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p))a in e&&a!=='style'?e[a]=v:e.setAttribute(a,v);e.append(...k);return e};
const id=n=>'f-'+n.replace(/[^a-z0-9]+/gi,'-');
const nav=document.getElementById('nav'),main=document.getElementById('main');
async function copy(text,btn,label){
  try{await navigator.clipboard.writeText(text)}catch{
    const t=$('textarea',{value:text});document.body.append(t);t.select();document.execCommand('copy');t.remove()}
  const o=label;btn.textContent='Copied ✓';btn.classList.add('done');
  setTimeout(()=>{btn.textContent=o;btn.classList.remove('done')},1500)}
const cards=[];
DATA.forEach(g=>{
  const sec=$('section',{className:'group'},$('h2',{},g.group));
  nav.append($('h2',{},g.group));
  g.files.forEach(f=>{
    const lines=f.content.replace(/\n$/,'').split('\n').length;
    const code=$('code',{className:'language-'+(f.name.endsWith('.yml')?'yaml':'sql')},f.content);
    const btn=$('button',{className:'primary'},'Copy');
    btn.onclick=()=>copy(f.content,btn,'Copy');
    const card=$('article',{className:'card',id:id(f.name)},
      $('div',{className:'card-head'},$('h3',{},f.name),$('span',{className:'meta'},lines+' lines'),
        $('a',{className:'btn',href:f.url,target:'_blank',rel:'noopener'},'Gist ↗'),btn),
      $('pre',{tabIndex:0},code));
    sec.append(card);
    const link=$('a',{href:'#'+id(f.name)},f.name);nav.append(link);
    cards.push({f,card,link,sec})});
  main.append(sec)});
const empty=$('p',{className:'empty hidden'},'No snippets match your filter.');main.append(empty);
const count=document.getElementById('count');
function filter(){
  const q=document.getElementById('q').value.trim().toLowerCase();let n=0;
  cards.forEach(c=>{const m=!q||c.f.name.toLowerCase().includes(q)||c.f.content.toLowerCase().includes(q);
    c.card.classList.toggle('hidden',!m);c.link.classList.toggle('hidden',!m);if(m)n++});
  document.querySelectorAll('section.group').forEach(s=>s.classList.toggle('hidden',!s.querySelector('.card:not(.hidden)')));
  empty.classList.toggle('hidden',n>0);
  count.textContent=n+' of '+cards.length+' files'}
document.getElementById('q').oninput=filter;filter();
if(window.hljs)document.querySelectorAll('pre code').forEach(el=>hljs.highlightElement(el));
const th=document.getElementById('theme');
th.onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){cards.forEach(c=>c.link.classList.toggle('active',c.card===e.target))}}),{rootMargin:'-80px 0px -70% 0px'});
cards.forEach(c=>io.observe(c.card));
</script>
</body>
</html>
